<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 580" role="img" aria-labelledby="t d"><title id="t">A credit is evidence. Its applicability is a question. / mobile</title><desc id="d">Recomposed mobile synthetic figure with readable labels.</desc><rect width="390" height="580" rx="16" fill="#F7F7F2"/><text x="20" y="26" font-family="IBM Plex Sans,Arial,sans-serif" font-size="10" fill="#56604F" font-weight="600">DEMO — SYNTHETIC DATA / CONCEPT PREVIEW</text><text x="20" y="62" font-family="IBM Plex Sans,Arial,sans-serif" font-size="22" fill="#192019" font-weight="600">A credit is evidence. Its</text><text x="20" y="88" font-family="IBM Plex Sans,Arial,sans-serif" font-size="22" fill="#192019" font-weight="600">applicability is a question.</text><rect x="20" y="132" width="350" height="54" rx="10" fill="#FFFFFF"/><text x="34" y="154" font-family="IBM Plex Sans,Arial,sans-serif" font-size="15" fill="#192019" font-weight="600">Credit source</text><text x="34" y="175" font-family="IBM Plex Sans,Arial,sans-serif" font-size="13" fill="#56604F" font-weight="400">CR-40 / $40</text><rect x="20" y="194" width="350" height="54" rx="10" fill="#FFF0DA"/><text x="34" y="216" font-family="IBM Plex Sans,Arial,sans-serif" font-size="15" fill="#192019" font-weight="600">Gross candidate</text><text x="34" y="237" font-family="IBM Plex Sans,Arial,sans-serif" font-size="13" fill="#56604F" font-weight="400">Acme overage $80 / NOT VERIFIED</text><rect x="20" y="256" width="350" height="54" rx="10" fill="#FFFFFF"/><text x="34" y="278" font-family="IBM Plex Sans,Arial,sans-serif" font-size="15" fill="#192019" font-weight="600">Applicability</text><text x="34" y="299" font-family="IBM Plex Sans,Arial,sans-serif" font-size="13" fill="#56604F" font-weight="400">Scope, period and prior use to review</text><rect x="20" y="318" width="350" height="54" rx="10" fill="#FFFFFF"/><text x="34" y="340" font-family="IBM Plex Sans,Arial,sans-serif" font-size="15" fill="#192019" font-weight="600">Conditional net</text><text x="34" y="361" font-family="IBM Plex Sans,Arial,sans-serif" font-size="13" fill="#56604F" font-weight="400">$40 only if credit applies</text><rect x="20" y="380" width="350" height="54" rx="10" fill="#FFFFFF"/><text x="34" y="402" font-family="IBM Plex Sans,Arial,sans-serif" font-size="15" fill="#192019" font-weight="600">Finance owner</text><text x="34" y="423" font-family="IBM Plex Sans,Arial,sans-serif" font-size="13" fill="#56604F" font-weight="400">Review before proposing correction</text><rect x="20" y="442" width="350" height="54" rx="10" fill="#FFFFFF"/><text x="34" y="464" font-family="IBM Plex Sans,Arial,sans-serif" font-size="15" fill="#192019" font-weight="600">Historical billability</text><text x="34" y="485" font-family="IBM Plex Sans,Arial,sans-serif" font-size="13" fill="#56604F" font-weight="400">Separate contract/legal decision</text><text x="20" y="557" font-family="IBM Plex Sans,Arial,sans-serif" font-size="12" fill="#56604F" font-weight="400">Illustrative / no external action executes</text></svg>