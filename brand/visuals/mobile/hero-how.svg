retation hold</text><text x="34" y="361" font-family="IBM Plex Sans,Arial,sans-serif" font-size="13" fill="#56604F" font-weight="400">Escalate ambiguous clauses</text><rect x="20" y="380" width="350" height="54" rx="10" fill="#FFF0DA"/><text x="34" y="402" font-family="IBM Plex Sans,Arial,sans-serif" font-size="15" fill="#192019" font-weight="600">Review export</text><text x="34" y="423" font-family="IBM Plex Sans,Arial,sans-serif" font-size="13" fill="#56604F" font-weight="400">Proposed correction evidence</text><rect x="20" y="442" width="350" height="54" rx="10" fill="#FFFFFF"/><text x="34" y="464" font-family="IBM Plex Sans,Arial,sans-serif" font-size="15" fill="#192019" font-weight="600">External actions</text><text x="34" y="485" font-family="IBM Plex Sans,Arial,sans-serif" font-size="13" fill="#56604F" font-weight="400">Unavailable in concept</text><text x="20" y="557" font-family="IBM Plex Sans,Arial,sans-serif" font-size="12" fill="#56604F" font-weight="400">Illustrative / no external action executes</text></svg>